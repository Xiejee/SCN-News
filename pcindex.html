<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCN v5.0 Horizon</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* 基础变量与重置 */
        :root {
            --brand: #4f46e5;
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-tertiary: #94a3b8;
            --border-light: rgba(148, 163, 184, 0.15);
            --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.03);
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.07);
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0f172a;
                --bg-secondary: #1e293b;
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --text-tertiary: #64748b;
                --border-light: rgba(148, 163, 184, 0.2);
                --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.1);
                --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.15);
                --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.2);
                --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.25);
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.5;
            font-size: 16px;
        }

        /* 认证层 - 全新设计 */
        #auth-layer {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: var(--transition-normal);
            backdrop-filter: blur(8px);
        }

        .auth-card {
            background: var(--bg-secondary);
            padding: 48px 32px;
            border-radius: var(--radius-xl);
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            overflow: hidden;
            border: 1px solid var(--border-light);
            transform: translateY(20px);
            animation: cardRise 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes cardRise {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-step {
            display: none;
            animation: slideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .auth-step.active { display: block; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .auth-card h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--brand), #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .auth-card p {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 0.95rem;
        }

        /* 表单控件 - 全新设计 */
        .field-container {
            position: relative;
            margin-bottom: 24px;
        }

        .field {
            width: 100%;
            padding: 16px 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-primary);
            font-size: 1rem;
            transition: var(--transition-normal);
            font-family: inherit;
        }

        .field:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            background: var(--bg-secondary);
        }

        .field-label {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            pointer-events: none;
            transition: var(--transition-fast);
            font-size: 1rem;
            background: var(--bg-secondary);
            padding: 0 4px;
        }

        .field:focus + .field-label,
        .field:not(:placeholder-shown) + .field-label {
            top: 0;
            transform: translateY(-50%);
            font-size: 0.8rem;
            color: var(--brand);
        }

        /* 按钮 - 全新设计 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            border-radius: var(--radius-md);
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
            font-size: 0.95rem;
            font-family: inherit;
        }

        .btn-primary {
            width: 100%;
            background: var(--brand);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.6s;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-text {
            background: transparent;
            color: var(--text-secondary);
            padding: 8px 16px;
            margin-top: 16px;
        }

        .btn-text:hover {
            color: var(--brand);
            background: rgba(79, 70, 229, 0.05);
        }

        /* 颜色选择器 - 全新设计 */
        .color-picker {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 32px 0;
        }

        .color-opt {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition-normal);
            border: 3px solid var(--bg-secondary);
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        .color-opt::after {
            content: '';
            position: absolute;
            inset: -4px;
            border: 2px solid var(--brand);
            border-radius: 50%;
            opacity: 0;
            transition: var(--transition-fast);
        }

        .color-opt.active {
            transform: scale(1.15);
        }

        .color-opt.active::after {
            opacity: 1;
        }

        .color-opt:hover {
            transform: scale(1.05);
        }

        /* 主应用层 - 全新设计 */
        #app-layer {
            display: none;
            opacity: 0;
            transition: opacity 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translateY(10px);
            min-height: 100vh;
        }

        /* 导航栏 - 全新设计 */
        .navbar {
            padding: 16px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            box-shadow: var(--shadow-xs);
        }

        @media (prefers-color-scheme: dark) {
            .navbar {
                background: rgba(30, 41, 59, 0.8);
            }
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--brand);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            position: relative;
        }

        .logo span::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--brand);
            border-radius: 2px;
            transform: scaleX(0);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: left;
        }

        .logo:hover span::after {
            transform: scaleX(1);
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-name {
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* 头像 - 全新设计 */
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
            box-shadow: var(--shadow-sm);
            background: var(--brand);
        }

        .avatar-lg {
            width: 64px;
            height: 64px;
            font-size: 1.4rem;
            border-radius: var(--radius-lg);
        }

        .avatar:hover {
            transform: rotate(5deg) scale(1.05);
            box-shadow: var(--shadow-md);
        }

        /* 搜索框 - 全新设计 */
        .search-container {
            padding: 20px 6%;
        }

        .search-bar {
            width: 100%;
            background: var(--bg-secondary);
            padding: 12px 20px;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-xs);
            transition: var(--transition-fast);
        }

        .search-bar:focus-within {
            box-shadow: var(--shadow-md);
            border-color: rgba(79, 70, 229, 0.2);
        }

        .search-icon {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .search-input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
        }

        /* 主容器 */
        .container {
            padding: 0 6% 60px 6%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* 视图切换 - 全新动画 */
        .view {
            display: none;
            animation: fadeInUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        .view.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 首页标题 */
        .page-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 24px 0 8px 0;
            color: var(--text-primary);
        }

        .page-subtitle {
            color: var(--text-secondary);
            font-size: 1.05rem;
            margin-bottom: 32px;
        }

        /* 网格布局 - 全新设计 */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        /* 卡片 - 全新设计 */
        .card {
            background: var(--bg-secondary);
            padding: 32px 24px;
            border-radius: var(--radius-lg);
            text-align: center;
            box-shadow: var(--shadow-xs);
            cursor: pointer;
            transition: var(--transition-normal);
            border: 1px solid var(--border-light);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--brand);
            transform: scaleX(0);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: left;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .card:hover::before {
            transform: scaleX(1);
        }

        .card-icon {
            font-size: 2.4rem;
            color: var(--brand);
            margin-bottom: 16px;
            display: block;
            transition: var(--transition-fast);
        }

        .card:hover .card-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .card-brand {
            background: linear-gradient(135deg, var(--brand), #6366f1);
            color: white;
            grid-column: span 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 28px;
        }

        .card-brand .card-icon,
        .card-brand .card-title {
            color: white;
            margin: 0;
        }

        .card-brand:hover {
            background: linear-gradient(135deg, #4338ca, #4f46e5);
        }

        .card-outline {
            background: transparent;
            border: 2px dashed var(--border-light);
        }

        .card-outline .card-icon,
        .card-outline .card-title {
            color: var(--text-secondary);
        }

        /* 返回按钮 */
        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--brand);
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 24px;
            font-size: 0.95rem;
            width: fit-content;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
        }

        .back-btn:hover {
            background: rgba(79, 70, 229, 0.05);
        }

        /* 列表项 - 全新设计 */
        .list-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .post-item {
            background: var(--bg-secondary);
            padding: 20px 24px;
            border-radius: var(--radius-lg);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-xs);
            cursor: pointer;
            transition: var(--transition-fast);
            border: 1px solid var(--border-light);
            border-left: 4px solid transparent;
        }

        .post-item:hover {
            transform: translateX(4px);
            box-shadow: var(--shadow-md);
            border-left-color: var(--brand);
        }

        .post-title {
            font-weight: 600;
            font-size: 1.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .post-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .post-arrow {
            color: var(--brand);
            font-size: 1.2rem;
        }

        /* 详情页 - 全新设计 */
        .detail-card {
            background: var(--bg-secondary);
            padding: 40px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-light);
            line-height: 1.8;
        }

        .detail-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--brand);
            margin-bottom: 16px;
        }

        .detail-meta {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-light);
        }

        .detail-content {
            line-height: 1.8;
            white-space: pre-wrap;
            font-size: 1.05rem;
        }

        /* 统计栏 */
        .stat-bar {
            display: flex;
            gap: 24px;
            padding: 24px 0;
            border-top: 1px solid var(--border-light);
            color: var(--text-secondary);
            margin-top: 24px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            transition: var(--transition-fast);
            cursor: pointer;
        }

        .stat-item:hover {
            background: rgba(0, 0, 0, 0.03);
            color: var(--brand);
        }

        #like-btn:hover i {
            color: #ef4444;
            animation: heartBeat 1s infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* 编辑器 - 全新设计 */
        .editor-card {
            background: var(--bg-secondary);
            padding: 32px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-light);
        }

        .editor-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        /* 设置页面 - 全新设计 */
        .settings-section {
            margin-top: 24px;
            background: var(--bg-secondary);
            padding: 28px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xs);
            border: 1px solid var(--border-light);
            transition: var(--transition-fast);
        }

        .settings-section:hover {
            box-shadow: var(--shadow-md);
        }

        .settings-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 8px;
        }

        .settings-name {
            font-weight: 600;
            font-size: 1.2rem;
        }

        .settings-uid {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .settings-group-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin: 24px 0 16px 0;
        }

        .settings-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .settings-item:last-child {
            border-bottom: none;
        }

        .settings-item:hover {
            color: var(--brand);
        }

        .settings-item:hover .settings-icon {
            color: var(--brand);
            transform: translateX(4px);
        }

        .settings-label {
            font-weight: 500;
            font-size: 0.95rem;
        }

        .settings-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .settings-icon {
            color: var(--text-secondary);
            font-size: 1.1rem;
            transition: var(--transition-fast);
        }

        .logout-item {
            color: #ef4444;
        }

        .logout-item .settings-icon {
            color: #ef4444;
        }

        /* 管理入口 */
        .admin-entrance {
            margin-top: 48px;
            text-align: center;
            color: var(--text-tertiary);
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition-fast);
            padding: 8px;
            border-radius: var(--radius-sm);
        }

        .admin-entrance:hover {
            color: var(--text-secondary);
            background: rgba(0, 0, 0, 0.03);
        }

        /* 管理页面 - 全新设计 */
        .admin-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 32px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
        }

        .admin-title {
            color: #facc15;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-item {
            display: flex;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            align-items: center;
            transition: var(--transition-fast);
        }

        .admin-item:last-child {
            border-bottom: none;
        }

        .admin-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-sm);
        }

        .admin-item-title {
            font-size: 0.95rem;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
            padding: 6px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
        }

        .btn-delete:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 图片样式 */
        .article-img {
            width: 100%;
            border-radius: var(--radius-lg);
            margin: 24px 0;
            box-shadow: var(--shadow-lg);
            transition: var(--transition-normal);
            border: 1px solid var(--border-light);
        }

        .article-img:hover {
            transform: scale(1.02);
        }

        /* 平滑滚动 */
        html {
            scroll-behavior: smooth;
        }

        /* 响应式优化 */
        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .card-brand {
                grid-column: span 1;
            }
            
            .auth-card {
                padding: 32px 24px;
            }
            
            .detail-card {
                padding: 24px;
            }
            
            .page-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- 认证层 -->
    <div id="auth-layer">
        <div class="auth-card">
            <div id="step-1" class="auth-step active">
                <h2>SCN Horizon</h2>
                <p>验证你的松鹤籍身份</p>
                
                <div class="field-container">
                    <input type="text" id="log-id" class="field" placeholder=" " required>
                    <label class="field-label">10位学号</label>
                </div>
                
                <div class="field-container">
                    <input type="password" id="log-pwd" class="field" placeholder=" " required>
                    <label class="field-label">访问密码</label>
                </div>
                
                <button class="btn btn-primary" onclick="checkAuthStep1()">
                    继续
                </button>
                <button class="btn btn-text" onclick="guestLogin()">
                    以非松鹤籍学生身份访问
                </button>
            </div>

            <div id="step-2" class="auth-step">
                <h2 id="step-2-title">完善档案</h2>
                <p id="step-2-sub">设置你的社区昵称和配色</p>
                
                <div class="field-container">
                    <input type="text" id="log-nick" class="field" placeholder=" " required>
                    <label class="field-label">你的昵称</label>
                </div>
                
                <div style="font-size:0.9rem; color:var(--text-secondary); margin: 16px 0;">
                    选择你的身份主题色
                </div>
                
                <div class="color-picker" id="colorPicker">
                    <div class="color-opt active" style="background:#4f46e5" data-color="#4f46e5"></div>
                    <div class="color-opt" style="background:#0ea5e9" data-color="#0ea5e9"></div>
                    <div class="color-opt" style="background:#10b981" data-color="#10b981"></div>
                    <div class="color-opt" style="background:#f59e0b" data-color="#f59e0b"></div>
                    <div class="color-opt" style="background:#ec4899" data-color="#ec4899"></div>
                    <div class="color-opt" style="background:#8b5cf6" data-color="#8b5cf6"></div>
                </div>
                
                <button class="btn btn-primary" id="btn-finish-profile" onclick="finishRegistration()">
                    完成设置并进入
                </button>
                <button id="btn-cancel-profile" class="btn btn-text" style="display:none;" onclick="closeProfileEditor()">
                    取消修改
                </button>
            </div>
        </div>
    </div>

    <!-- 主应用层 -->
    <div id="app-layer">
        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="logo">SCN<span> Odyssey</span></div>
            <div class="user-area">
                <span id="nav-name" class="user-name"></span>
                <div id="nav-avatar" class="avatar" onclick="showView('settings')"></div>
            </div>
        </nav>

        <!-- 搜索区域 -->
        <div class="search-container" id="global-search-area">
            <div class="search-bar">
                <i class="ri-search-2-line search-icon"></i>
                <input type="text" id="search-input" class="search-input" placeholder="搜索文章标题..." oninput="handleSearch()">
            </div>
        </div>

        <!-- 主内容容器 -->
        <div class="container">
            <!-- 首页视图 -->
            <div id="view-home" class="view active">
                <h1 class="page-title">探索社区</h1>
                <p class="page-subtitle">你好，欢迎来到第 5 代 Odyssey。</p>
                
                <div class="grid">
                    <div class="card" onclick="loadNews('news_')">
                        <i class="ri-fire-line card-icon"></i>
                        <div class="card-title">校园快讯</div>
                    </div>
                    <div class="card" onclick="loadNews('week_')">
                        <i class="ri-article-line card-icon"></i>
                        <div class="card-title">深度周刊</div>
                    </div>
                    <div class="card" onclick="loadNews('poem_')">
                        <i class="ri-quill-pen-line card-icon"></i>
                        <div class="card-title">文学诗词</div>
                    </div>
                    <div class="card" onclick="loadNews('all')">
                        <i class="ri-layout-grid-line card-icon"></i>
                        <div class="card-title">全部内容</div>
                    </div>
                    
                    <div class="card card-brand" id="btn-pub-home" onclick="showView('editor')">
                        <i class="ri-add-circle-fill card-icon"></i>
                        <div class="card-title">发布我的新闻</div>
                    </div>
                    
                    <div class="card card-outline" onclick="showView('settings')">
                        <i class="ri-settings-4-line card-icon"></i>
                        <div class="card-title">设置中心</div>
                    </div>
                </div>
            </div>

            <!-- 列表视图 -->
            <div id="view-list" class="view">
                <div class="back-btn" onclick="showView('home')">
                    <i class="ri-arrow-left-s-line"></i>
                    <span>返回首页</span>
                </div>
                <h2 id="list-title" class="list-title">加载中...</h2>
                <div id="list-container"></div>
            </div>

            <!-- 详情视图 -->
            <div id="view-detail" class="view">
                <div class="back-btn" onclick="showView('list')">
                    <i class="ri-arrow-left-s-line"></i>
                    <span>返回列表</span>
                </div>
                <div id="detail-card" class="detail-card">
                    <h1 class="detail-title" id="detail-title"></h1>
                    <div class="detail-meta" id="detail-date"></div>
                    <div class="detail-content" id="detail-content"></div>
                </div>
                
                <div class="stat-bar" id="stat-bar">
                    <div class="stat-item">
                        <i class="ri-eye-line"></i>
                        <span id="v-count">0</span>
                    </div>
                    <div class="stat-item" id="like-btn" onclick="handleLike()">
                        <i class="ri-heart-line"></i>
                        <span id="l-count">0</span>
                    </div>
                </div>
            </div>

            <!-- 编辑器视图 -->
            <div id="view-editor" class="view">
                <div class="back-btn" onclick="showView('home')">
                    <i class="ri-arrow-left-s-line"></i>
                    <span>放弃创作</span>
                </div>
                <div class="editor-card">
                    <h2 class="editor-title">创作中心</h2>
                    
                    <div class="field-container">
                        <input type="text" id="p-title" class="field" placeholder=" " required>
                        <label class="field-label">请输入新闻标题</label>
                    </div>
                    
                    <div class="field-container">
                        <select id="p-cat" class="field">
                            <option value="news_">校园快讯</option>
                            <option value="week_">深度周刊</option>
                            <option value="poem_">文学诗词</option>
                        </select>
                    </div>
                    
                    <div class="field-container">
                        <textarea id="p-body" class="field" rows="12" placeholder=" " required></textarea>
                        <label class="field-label">正文内容...</label>
                    </div>
                    
                    <button class="btn btn-primary" id="pub-submit-btn" onclick="handleFinalPublish()">
                        立即同步到云端
                    </button>
                </div>
            </div>

            <!-- 设置视图 -->
            <div id="view-settings" class="view">
                <div class="back-btn" onclick="showView('home')">
                    <i class="ri-arrow-left-s-line"></i>
                    <span>返回</span>
                </div>
                
                <div class="settings-section">
                    <div class="settings-header">
                        <div id="set-avatar" class="avatar avatar-lg"></div>
                        <div>
                            <div id="set-name" class="settings-name"></div>
                            <div id="set-uid" class="settings-uid"></div>
                        </div>
                    </div>
                </div>

                <div class="settings-section">
                    <div class="settings-group-title">个人设置</div>
                    <div class="settings-item" id="opt-edit-profile" onclick="openProfileEditor()">
                        <div class="settings-label">修改个人资料</div>
                        <i class="ri-user-settings-line settings-icon"></i>
                    </div>
                    
                    <div class="settings-group-title">软件与更新</div>
                    <div class="settings-item" onclick="checkUpdates()">
                        <div>
                            <div class="settings-label">检查更新</div>
                            <div class="settings-desc">当前版本: v5.0.0 Horizon</div>
                        </div>
                        <i class="ri-refresh-line settings-icon"></i>
                    </div>
                    <div class="settings-item" onclick="downloadApk()">
                        <div>
                            <div class="settings-label">下载 Android 应用 (APK)</div>
                            <div class="settings-desc">下载最新安装包文件</div>
                        </div>
                        <i class="ri-download-cloud-2-line settings-icon"></i>
                    </div>
                    <div class="settings-item logout-item" onclick="logout()">
                        <div class="settings-label">退出登录</div>
                        <i class="ri-logout-box-r-line settings-icon"></i>
                    </div>
                </div>
                
                <div id="admin-entrance" class="admin-entrance" onclick="adminClick()">
                    SCN v5.0.0 Horizon | Build 20260209
                </div>
            </div>

            <!-- 管理视图 -->
            <div id="view-admin" class="view">
                <div class="back-btn" style="color:#facc15" onclick="showView('home')">
                    <i class="ri-arrow-left-s-line"></i>
                    <span>退出管理</span>
                </div>
                <div class="admin-card">
                    <h2 class="admin-title">
                        <i class="ri-shield-user-line"></i>
                        管理中心
                    </h2>
                    <div id="admin-content"></div>
                </div>
            </div>
        </div>
    </div>

<script>
    // 保留原有功能逻辑，仅适配新UI
    const part1 = "ghp_6pSfHi";
    const part2 = "gw0Rrjt5KlrXwvt29Nk2Wi4J2soacY";
    const G_T = part1 + part2;

    const GITHUB = { user: 'Xiejee', repo: 'SCN-News', path: 'news', token: G_T };
    
    let user = null;
    let selectedColor = "#4f46e5";
    let newsList = [];
    let currentDocId = "";
    let adminTaps = 0;
    let isEditingProfile = false;

    // 颜色选择器初始化
    document.querySelectorAll('.color-opt').forEach(opt => {
        opt.onclick = () => {
            document.querySelectorAll('.color-opt').forEach(o => o.classList.remove('active'));
            opt.classList.add('active');
            selectedColor = opt.dataset.color;
        };
    });

    // 页面加载
    window.onload = () => {
        const local = localStorage.getItem('scn_v5_user');
        if(local) {
            user = JSON.parse(local);
            startApp();
        }
        preloadAllNews();
    };

    // 预加载所有新闻
    async function preloadAllNews() {
        try {
            const res = await fetch(`https://api.github.com/repos/${GITHUB.user}/${GITHUB.repo}/contents/${GITHUB.path}`);
            const data = await res.json();
            const files = data.filter(f => f.name.endsWith('.txt'));
            const detailPromises = files.map(async f => {
                const r = await fetch(f.download_url);
                const txt = await r.text();
                return {
                    id: f.name,
                    title: (txt.match(/TITLE:\s*(.*)/) || [])[1] || f.name,
                    date: (txt.match(/DATE:\s*(.*)/) || [])[1] || "",
                    body: txt.split('---')[1] || ""
                };
            });
            newsList = (await Promise.all(detailPromises)).sort((a,b) => new Date(b.date) - new Date(a.date));
        } catch (e) {
            console.error("预加载新闻失败:", e);
        }
    }

    // 验证第一步
    function checkAuthStep1() {
        const id = document.getElementById('log-id').value;
        const pwd = document.getElementById('log-pwd').value;
        const isSNH = /^1420240[12](0[1-9]|[1-4][0-9]|5[0-2])$/.test(id);
        const isAdmin = (id === '1420240102' || id === '1420240201');
        
        if(!isSNH && !isAdmin) return alert("抱歉，该学号不在名单中。");
        if(!pwd) return alert("请输入密码。");
        
        const profile = localStorage.getItem(`profile_${id}`);
        if(!profile) {
            document.getElementById('step-1').classList.remove('active');
            document.getElementById('step-2').classList.add('active');
        } else {
            user = JSON.parse(profile);
            saveAndStart();
        }
    }

    // 打开资料编辑
    function openProfileEditor() {
        if(user.uid === 'guest') return alert("访客无法修改资料");
        
        isEditingProfile = true;
        document.getElementById('auth-layer').style.display = 'flex';
        document.getElementById('step-1').classList.remove('active');
        document.getElementById('step-2').classList.add('active');
        
        // 预填当前数据
        document.getElementById('step-2-title').innerText = "修改资料";
        document.getElementById('step-2-sub').innerText = "更新你的昵称和主题色";
        document.getElementById('log-nick').value = user.name;
        document.getElementById('btn-finish-profile').innerText = "保存修改";
        document.getElementById('btn-cancel-profile').style.display = 'block';

        // 预选颜色
        document.querySelectorAll('.color-opt').forEach(opt => {
            if(opt.dataset.color === user.color) {
                opt.click();
            }
        });
    }

    // 关闭资料编辑
    function closeProfileEditor() {
        isEditingProfile = false;
        document.getElementById('auth-layer').style.display = 'none';
        document.getElementById('step-2').classList.remove('active');
        document.getElementById('step-1').classList.add('active');
    }

    // 完成注册/修改
    function finishRegistration() {
        let id;
        if(isEditingProfile) {
            id = user.uid;
        } else {
            id = document.getElementById('log-id').value;
        }
        
        const nick = document.getElementById('log-nick').value;
        const isAdmin = (id === '1420240102' || id === '1420240201');
        
        if(!nick) return alert("请设置昵称");
        
        user = { 
            uid: id, 
            name: nick, 
            color: selectedColor, 
            role: isAdmin ? 'admin' : 'student' 
        };
        
        localStorage.setItem(`profile_${id}`, JSON.stringify(user));
        
        if(isEditingProfile) {
            alert("修改成功");
            isEditingProfile = false;
            document.getElementById('auth-layer').style.display = 'none';
            startApp();
        } else {
            saveAndStart();
        }
    }

    // 访客登录
    function guestLogin() {
        user = { uid: 'guest', name: '访客学生', color: '#64748b', role: 'guest' };
        startApp();
    }

    // 保存并启动应用
    function saveAndStart() {
        localStorage.setItem('scn_v5_user', JSON.stringify(user));
        startApp();
    }

    // 启动应用
    function startApp() {
        document.getElementById('auth-layer').style.display = 'none';
        document.getElementById('app-layer').style.display = 'block';
        
        setTimeout(() => {
            document.getElementById('app-layer').style.opacity = '1';
            document.getElementById('app-layer').style.transform = 'translateY(0)';
        }, 50);
        
        // 更新UI
        document.documentElement.style.setProperty('--brand', user.color);
        document.getElementById('nav-name').innerText = user.name;
        document.getElementById('nav-avatar').innerText = user.name[0];
        document.getElementById('nav-avatar').style.background = user.color;
        document.getElementById('set-name').innerText = user.name;
        document.getElementById('set-uid').innerText = user.uid;
        document.getElementById('set-avatar').innerText = user.name[0];
        document.getElementById('set-avatar').style.background = user.color;
        
        // 访客权限控制
        if(user.role === 'guest') {
            document.getElementById('btn-pub-home').style.display = 'none';
            document.getElementById('opt-edit-profile').style.display = 'none';
        } else {
            document.getElementById('btn-pub-home').style.display = 'flex';
            document.getElementById('opt-edit-profile').style.display = 'flex';
        }
    }

    // 搜索处理
    function handleSearch() {
        const query = document.getElementById('search-input').value.toLowerCase();
        if(!query) {
            if(document.getElementById('view-list').classList.contains('active')) renderList(newsList);
            return;
        }
        
        if(document.getElementById('view-home').classList.contains('active')) {
            showView('list');
            document.getElementById('list-title').innerText = "搜索结果";
        }
        
        const filtered = newsList.filter(n => n.title.toLowerCase().includes(query));
        renderList(filtered);
    }

    // 显示视图
    function showView(vid) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + vid).classList.add('active');
        
        const searchArea = document.getElementById('global-search-area');
        searchArea.style.display = (vid === 'home' || vid === 'list') ? 'block' : 'none';
        
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }

    // 加载新闻列表
    async function loadNews(prefix) {
        showView('list');
        document.getElementById('list-container').innerHTML = "<p style='text-align:center; color:var(--text-secondary); padding:30px;'>同步中...</p>";
        document.getElementById('list-title').innerText = "文章目录";
        
        if(newsList.length === 0) await preloadAllNews();
        const filtered = prefix === 'all' ? newsList : newsList.filter(n => n.id.startsWith(prefix));
        renderList(filtered);
    }

    // 渲染列表
    function renderList(list) {
        if(list.length === 0) {
            document.getElementById('list-container').innerHTML = "<p style='text-align:center; color:var(--text-secondary); padding:30px; font-size:1.1rem;'>空空如也</p>";
            return;
        }
        
        document.getElementById('list-container').innerHTML = list.map(n => `
            <div class="post-item" onclick="openDetail('${n.id}')">
                <div>
                    <div class="post-title">${n.title}</div>
                    <div class="post-date">${n.date}</div>
                </div>
                <i class="ri-arrow-right-line post-arrow"></i>
            </div>
        `).join('');
    }

    // 打开详情
    async function openDetail(id) {
        currentDocId = id;
        const item = newsList.find(n => n.id === id);
        
        if(!item) return;
        
        let html = item.body.trim();
        html = html.replace(/<file\/picture>(.*?)>/g, (m,p) => 
            `<img src="https://raw.githubusercontent.com/${GITHUB.user}/${GITHUB.repo}/main/pictures/${p.trim()}" class="article-img">`
        );
        
        document.getElementById('detail-title').innerText = item.title;
        document.getElementById('detail-date').innerText = item.date;
        document.getElementById('detail-content').innerHTML = html;
        
        // 统计浏览量
        const vKey = `view_${id}`;
        let views = parseInt(localStorage.getItem(vKey) || "0") + 1;
        localStorage.setItem(vKey, views);
        document.getElementById('v-count').innerText = views;
        document.getElementById('l-count').innerText = localStorage.getItem(`like_${id}`) || "0";
        
        showView('detail');
    }

    // 点赞处理
    function handleLike() {
        if(user.role === 'guest') return alert("访客无法点赞");
        
        const key = `user_liked_${currentDocId}`;
        if(localStorage.getItem(key)) return alert("已赞过");
        
        let likes = parseInt(localStorage.getItem(`like_${currentDocId}`) || "0") + 1;
        localStorage.setItem(`like_${currentDocId}`, likes);
        localStorage.setItem(key, 'true');
        document.getElementById('l-count').innerText = likes;
        
        // 烟花效果
        confetti({ 
            particleCount: 180, 
            colors: [user.color, '#ffffff', '#f1f5f9'],
            spread: 70,
            origin: { y: 0.8 },
            gravity: 0.8
        });
    }

    // 发布内容
    async function handleFinalPublish() {
        const t = document.getElementById('p-title').value;
        const c = document.getElementById('p-cat').value;
        const b = document.getElementById('p-body').value;
        
        if(!t || !b) return alert("内容不全");
        
        const btn = document.getElementById('pub-submit-btn');
        btn.disabled = true; 
        btn.innerHTML = '<span class="loading"></span> 上传中...';
        
        try {
            const raw = `TITLE: ${t}\nDATE: ${new Date().toISOString().split('T')[0]}\n---\n${b}\n\n撰稿：${user.name}`;
            const b64 = btoa(unescape(encodeURIComponent(raw)));
            
            await fetch(`https://api.github.com/repos/${GITHUB.user}/${GITHUB.repo}/contents/${GITHUB.path}/${c}${Date.now()}.txt`, {
                method: 'PUT',
                headers: { 
                    'Authorization': `token ${GITHUB.token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ 
                    message: "publish", 
                    content: b64 
                })
            });
            
            alert("已成功同步到云端"); 
            preloadAllNews(); 
            showView('home');
        } catch (e) { 
            console.error("发布失败:", e);
            alert("同步失败，请检查网络或权限"); 
        }
        
        btn.disabled = false; 
        btn.innerText = "立即同步到云端";
    }

    // 检查更新
    function checkUpdates() {
        alert("当前版本 v5.0.0 Horizon 已是最新版本。");
    }

    // 下载APK
    function downloadApk() {
        const url = `https://github.com/${GITHUB.user}/${GITHUB.repo}/releases/latest`;
        const confirmDownload = confirm("即将前往下载页面。如果你尚未创建 Release，请确认仓库根目录下是否有 APK 文件。");
        
        if(confirmDownload) {
            window.open(url, '_blank');
        }
    }

    // 退出登录
    function logout() { 
        if(confirm("确定要退出登录吗？")) {
            localStorage.removeItem('scn_v5_user'); 
            location.reload(); 
        }
    }

    // 管理员点击
    function adminClick() {
        if(user.role !== 'admin') return;
        
        if(++adminTaps >= 5) { 
            adminTaps = 0; 
            openAdmin(); 
        }
    }

    // 打开管理面板
    function openAdmin() {
        showView('admin');
        
        if(newsList.length === 0) {
            document.getElementById('admin-content').innerHTML = "<p style='color:var(--text-secondary); padding:20px; text-align:center;'>暂无内容可管理</p>";
            return;
        }
        
        document.getElementById('admin-content').innerHTML = newsList.map(n => `
            <div class="admin-item">
                <span class="admin-item-title">${n.title}</span>
                <button class="btn btn-delete" onclick="deleteNews('${n.id}')">删除</button>
            </div>
        `).join('');
    }

    // 删除新闻
    async function deleteNews(id) {
        if(!confirm("确定要永久删除这篇文章吗？此操作不可恢复！")) return;
        
        try {
            const res = await fetch(`https://api.github.com/repos/${GITHUB.user}/${GITHUB.repo}/contents/${GITHUB.path}/${id}`);
            const file = await res.json();
            
            await fetch(`https://api.github.com/repos/${GITHUB.user}/${GITHUB.repo}/contents/${GITHUB.path}/${id}`, {
                method: 'DELETE',
                headers: { 
                    'Authorization': `token ${GITHUB.token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ 
                    message: "delete", 
                    sha: file.sha 
                })
            });
            
            alert("已成功删除"); 
            preloadAllNews().then(() => loadNews('all'));
        } catch (e) { 
            console.error("删除失败:", e);
            alert("删除失败，请检查权限或网络"); 
        }
    }
</script>
</body>
</html>
