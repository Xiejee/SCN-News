<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCN v4.0.3 Odyssey Pro</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --brand: #6366f1;
            --brand-dark: #4f46e5;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --sub: #64748b;
            --radius: 24px;
            --bezier: cubic-bezier(0.16, 1, 0.3, 1);
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'PingFang SC', system-ui, sans-serif;
            background: var(--bg); margin: 0; color: var(--text);
            overflow-x: hidden; scroll-behavior: smooth;
        }

        /* --- 动态过渡动画 --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes staggerIn {
            from { opacity: 0; transform: translateX(-15px); }
            to { opacity: 1; transform: translateX(0); }
        }
        /* 搜索页面专项动画 */
        @keyframes searchReveal {
            from { opacity: 0; transform: scale(1.08) translateY(-10px); filter: blur(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        /* --- 加载屏 --- */
        #loader {
            position: fixed; inset: 0; background: #fff; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.8s var(--bezier);
        }
        .spinner { width: 40px; height: 40px; border: 3px solid #f3f3f3; border-top: 3px solid var(--brand); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- 导航 --- */
        .navbar {
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px);
            padding: 12px 6%; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--brand); letter-spacing: -1px; cursor: pointer; }

        .container { padding: 20px 6%; max-width: 800px; margin: 0 auto; }
        .view { display: none; opacity: 0; }
        .view.active { display: block; animation: fadeInUp 0.6s var(--bezier) forwards; }

        /* --- 核心网格 --- */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-top: 25px; }
        .card {
            background: var(--card); padding: 30px 20px; border-radius: var(--radius);
            text-align: center; box-shadow: var(--shadow); cursor: pointer; 
            transition: all 0.4s var(--bezier); border: 1px solid transparent;
        }
        .card:hover { transform: translateY(-8px); border-color: var(--brand); box-shadow: 0 20px 30px -10px rgba(99, 102, 241, 0.2); }
        .card:active { transform: scale(0.94); }
        .card i { font-size: 2.5rem; color: var(--brand); margin-bottom: 12px; display: block; }

        .card-main { background: var(--brand); grid-column: span 2; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .card-main i, .card-main b { color: #fff; margin: 0; }

        /* --- 列表卡片 --- */
        .item-card {
            background: #fff; padding: 20px; border-radius: 20px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: var(--shadow); cursor: pointer; transition: 0.3s var(--bezier); opacity: 0;
        }
        .item-card:hover { transform: translateX(8px); border-left: 4px solid var(--brand); }

        .back-nav {
            display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px;
            background: #fff; border-radius: 12px; color: var(--brand); font-weight: 700;
            cursor: pointer; margin-bottom: 20px; box-shadow: var(--shadow); transition: 0.3s;
        }

        /* --- 搜索层渲染 --- */
        #search-view {
            position: fixed; inset: 0; background: rgba(255,255,255,0.98); backdrop-filter: blur(25px);
            z-index: 2000; display: none; flex-direction: column; padding: 20px 6%;
        }
        #search-view.active {
            display: flex; animation: searchReveal 0.5s var(--bezier) forwards;
        }

        /* --- 玻璃面板与按钮 --- */
        .glass-panel { background: #fff; padding: 30px; border-radius: 30px; box-shadow: var(--shadow); }
        .field { width: 100%; padding: 15px; border-radius: 15px; border: 2px solid #f1f5f9; margin-bottom: 15px; font-size: 1rem; transition: 0.3s; }
        .field:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(99,102,241,0.1); outline: none; }
        
        .btn-action {
            width: 100%; background: var(--brand); color: #fff; padding: 18px;
            border-radius: 18px; border: none; font-weight: 800; cursor: pointer; transition: 0.3s;
            margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-action:active { transform: scale(0.96); opacity: 0.9; }
        .btn-secondary { background: #f1f5f9; color: var(--text); }

        .article-img { width: 100%; border-radius: 20px; margin: 15px 0; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <h2 style="color:var(--brand); letter-spacing:4px; margin-top:20px;">SCN 4.0.3</h2>
    </div>

    <nav class="navbar">
        <div class="logo" onclick="showView('home')">SCN<span> Odyssey</span></div>
        <i class="ri-search-2-line" style="font-size:1.4rem; cursor:pointer;" onclick="openSearch()"></i>
    </nav>

    <div id="search-view">
        <div style="display:flex; gap:15px; align-items:center; margin-bottom:20px;">
            <div style="flex:1; position:relative;">
                <i class="ri-search-line" style="position:absolute; left:15px; top:15px; color:var(--sub);"></i>
                <input type="text" id="searchInput" class="field" style="margin:0; padding-left:45px;" placeholder="搜索标题、内容或作者..." oninput="doSearch()">
            </div>
            <span onclick="closeSearch()" style="cursor:pointer; font-weight:bold; color:var(--brand);">取消</span>
        </div>
        <div id="searchResult" style="overflow-y:auto; flex:1;"></div>
    </div>

    <div class="container">
        <div id="view-home" class="view active">
            <header style="margin: 30px 0;">
                <h1 style="font-size: 2.2rem; margin:0; letter-spacing:-1px;">你好，SCN Odyssey 💫</h1>
                <p style="color:var(--sub);">班级新闻，由我们共同见证</p>
            </header>
            <div class="grid">
                <div class="card" onclick="switchCategory('news_')"><i class="ri-article-line"></i><b>校园快讯</b></div>
                <div class="card" onclick="switchCategory('week_')"><i class="ri-compass-discover-line"></i><b>深度周刊</b></div>
                <div class="card" onclick="switchCategory('poem_')"><i class="ri-quill-pen-line"></i><b>文学诗词</b></div>
                <div class="card" onclick="switchCategory('all')"><i class="ri-layout-grid-line"></i><b>全站索引</b></div>
                <div class="card card-main" onclick="showView('editor')">
                    <i class="ri-add-circle-fill"></i><b>立即发布内容</b>
                </div>
                <div class="card" style="background:#f1f5f9; border:none;" onclick="showView('settings')">
                    <i class="ri-settings-4-line" style="color:var(--sub)"></i><b style="color:var(--sub)">设置中心</b>
                </div>
            </div>
        </div>

        <div id="view-settings" class="view">
            <div class="back-nav" onclick="showView('home')"><i class="ri-arrow-left-s-line"></i> 返回</div>
            <div class="glass-panel">
                <div style="text-align:center; margin-bottom:30px;">
                    <div style="width:70px; height:70px; background:var(--brand); border-radius:20px; margin:0 auto 15px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:1.8rem; font-weight:900;">SCN</div>
                    <h2 style="margin:0;">系统设置</h2>
                    <p style="color:var(--sub);">Version 4.0.3.20260202</p>
                </div>

                <div style="background:#f8fafc; padding:20px; border-radius:20px; margin-bottom:25px;">
                    <h3 style="margin-top:0; font-size:1rem; color:var(--brand);">开发者信息</h3>
                    <p style="font-size:0.9rem; color:var(--sub); margin:5px 0;">Engine: Odyssey Visual Engine</p>
                    <p style="font-size:0.9rem; color:var(--sub); margin:5px 0;">Server: GitHub Cloud Cluster</p>
                    <p style="font-size:0.9rem; color:var(--sub); margin:5px 0;">更新时间: 2026-02-02 15:30</p>
                </div>

                <button class="btn-action" onclick="alert('当前已是最新版本：4.0.3.20260202')">
                    <i class="ri-refresh-line"></i> 检查版本更新
                </button>
                <button class="btn-action btn-secondary" onclick="window.location.href='https://github.com/Xiejee/SCN-News/releases'">
                    <i class="ri-android-line"></i> 下载安卓 APK
                </button>
            </div>
        </div>

        <div id="view-list" class="view"><div class="back-nav" onclick="showView('home')"><i class="ri-arrow-left-s-line"></i> 返回</div><h2 id="listTitle" style="font-size:1.6rem; margin-bottom:20px;">列表</h2><div id="listContainer"></div></div>
        <div id="view-detail" class="view"><div class="back-nav" onclick="showView('list')"><i class="ri-arrow-left-s-line"></i> 返回</div><div id="detailContent" class="glass-panel"></div></div>
        <div id="view-editor" class="view"><div class="back-nav" onclick="showView('home')"><i class="ri-arrow-left-s-line"></i> 放弃</div><div class="glass-panel"><h2>创作中心</h2><input type="text" id="eTitle" class="field" placeholder="标题"><input type="text" id="eAuthor" class="field" placeholder="署名"><select id="eCat" class="field"><option value="news_">校园快讯</option><option value="week_">深度周刊</option><option value="poem_">文学诗词</option></select><textarea id="eBody" class="field" rows="8" placeholder="正文内容..."></textarea><button id="pubBtn" class="btn-action" onclick="handlePublish()">立即同步发布</button></div></div>
    </div>

<script>
    const G_T = "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"; 
    const CFG = { u:'Xiejee', r:'SCN-News', p:'news', i:'pictures' };
    let newsDB = [];

    // --- 优雅搜索过渡 ---
    function openSearch() {
        const s = document.getElementById('search-view');
        s.style.display = 'flex';
        setTimeout(() => s.classList.add('active'), 10);
        document.getElementById('searchInput').focus();
    }
    function closeSearch() {
        const s = document.getElementById('search-view');
        s.classList.remove('active');
        setTimeout(() => s.style.display = 'none', 500);
    }

    // --- 核心业务逻辑 ---
    function showView(vid) {
        const active = document.querySelector('.view.active');
        const target = document.getElementById('view-' + vid);
        if(active) {
            active.style.opacity = '0'; active.style.transform = 'translateY(-20px)';
            setTimeout(() => { active.classList.remove('active'); target.classList.add('active'); }, 300);
        } else { target.classList.add('active'); }
        window.scrollTo(0,0);
    }

    async function handlePublish() {
        const t = document.getElementById('eTitle').value, a = document.getElementById('eAuthor').value, c = document.getElementById('eCat').value, b = document.getElementById('eBody').value;
        if(!t || !a || !b) return alert("内容不完整");
        const btn = document.getElementById('pubBtn');
        btn.disabled = true; btn.innerText = "云端同步中...";
        const now = new Date();
        const ds = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()} ${now.getHours()}:${now.getMinutes()}`;
        const content = `TITLE: ${t}\nDATE: ${ds}\n---\n${b}\n\n撰稿人：${a}`;
        try {
            const b64 = btoa(unescape(encodeURIComponent(content)));
            const res = await fetch(`https://api.github.com/repos/${CFG.u}/${CFG.r}/contents/${CFG.p}/${c}${now.getTime()}.txt`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${G_T}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `v4.0.3 Pub: ${t}`, content: b64 })
            });
            if(res.ok) { confetti({ particleCount: 150 }); alert("✨ 已同步至云端存储库"); location.reload(); }
            else throw new Error("API 连接中断");
        } catch (e) { alert(e.message); btn.disabled = false; btn.innerText = "确认发布"; }
    }

    async function init() {
        try {
            const res = await fetch(`https://api.github.com/repos/${CFG.u}/${CFG.r}/contents/${CFG.p}`);
            const files = await res.json();
            const ps = files.filter(f => f.name.endsWith('.txt')).map(async f => {
                const tr = await fetch(f.download_url);
                const t = await tr.text();
                return {
                    path: f.path, name: f.name,
                    title: (t.match(/TITLE:\s*(.*)/i) || [])[1] || f.name,
                    date: (t.match(/DATE:\s*(.*)/i) || [])[1] || "2026-01-01",
                    body: t.split('---')[1] || ""
                };
            });
            newsDB = (await Promise.all(ps)).sort((a,b) => new Date(b.date.replace(/-/g,'/')) - new Date(a.date.replace(/-/g,'/')));
            setTimeout(() => { document.getElementById('loader').style.opacity = '0'; setTimeout(()=>document.getElementById('loader').style.display='none', 800); }, 1000);
        } catch (e) { console.error("Init Error"); }
    }

    function switchCategory(cat) {
        const f = (cat === 'all') ? newsDB : newsDB.filter(i => i.name.startsWith(cat));
        document.getElementById('listContainer').innerHTML = f.map((item, idx) => `
            <div class="item-card" style="animation: staggerIn 0.5s var(--bezier) ${idx * 0.05}s forwards;" onclick="goDetail('${item.path}')">
                <div><div style="font-weight:900;">${item.title}</div><div style="font-size:0.8rem; color:var(--sub); margin-top:4px;">${item.date}</div></div>
                <i class="ri-arrow-right-line" style="color:var(--brand);"></i>
            </div>
        `).join('') || "暂无内容";
        showView('list');
    }

    function goDetail(path) {
        const item = newsDB.find(i => i.path === path);
        let b = item.body.trim().replace(/&lt;file\/picture&gt;(.*?)&gt;|<file\/picture>(.*?)>/g, (m, p1, p2) => `<img src="https://raw.githubusercontent.com/${CFG.u}/${CFG.r}/main/${CFG.i}/${(p1||p2).trim()}" class="article-img">`);
        document.getElementById('detailContent').innerHTML = `<h1 style="color:var(--brand);">${item.title}</h1><p style="color:var(--sub);">${item.date}</p><div style="white-space:pre-wrap; line-height:1.8;">${b}</div>`;
        showView('detail');
    }

    function doSearch() {
        const k = document.getElementById('searchInput').value.toLowerCase();
        const resEl = document.getElementById('searchResult');
        if(!k) { resEl.innerHTML = ''; return; }
        const r = newsDB.filter(i => i.title.toLowerCase().includes(k) || i.body.toLowerCase().includes(k));
        resEl.innerHTML = r.map(i => `<div class="item-card" style="opacity:1;" onclick="closeSearch(); goDetail('${i.path}')"><b>${i.title}</b><i class="ri-arrow-right-line"></i></div>`).join('');
    }

    init();
</script>
</body>
</html>
