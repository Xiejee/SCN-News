<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCN v5.1 Horizon</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --brand: #4f46e5;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --sub: #64748b;
            --radius: 20px;
            --bezier: cubic-bezier(0.34, 1.56, 0.64, 1);
            --shadow: 0 10px 30px -5px rgba(0,0,0,0.05);
        }

        @media (prefers-color-scheme: dark) {
            :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --sub: #94a3b8; }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; font-family: 'PingFang SC', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* --- 认证引导层 --- */
        #auth-layer {
            position: fixed; inset: 0; z-index: 9999; background: var(--bg);
            display: flex; align-items: center; justify-content: center; padding: 20px;
            transition: opacity 0.5s;
        }
        .auth-card {
            background: var(--card); padding: 40px 30px; border-radius: 30px; width: 100%; max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1); text-align: center;
            animation: floatUp 0.8s var(--bezier);
        }
        @keyframes floatUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .btn-action {
            width: 100%; padding: 16px; border-radius: 15px; background: var(--brand); color: #fff;
            border: none; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s;
            margin-top: 20px; box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.3);
        }
        .btn-action:active { transform: scale(0.96); }
        .btn-ghost { background: transparent; color: var(--sub); margin-top: 15px; font-size: 0.9rem; border: none; cursor: pointer; }

        /* --- 主应用界面 --- */
        #app-layer { display: none; opacity: 0; transition: 0.8s; }
        .navbar { padding: 15px 6%; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; background: rgba(248,250,252,0.8); backdrop-filter: blur(20px); }
        .logo { font-size: 1.4rem; font-weight: 900; color: var(--brand); letter-spacing: -1px; }
        .avatar-sm { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.9rem; font-weight: bold; cursor: pointer; transition: 0.3s; }

        /* 搜索栏 */
        .search-container { padding: 5px 6% 15px 6%; }
        .search-bar { width: 100%; background: var(--card); padding: 14px 20px; border-radius: 18px; display: flex; align-items: center; gap: 10px; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 4px 10px rgba(0,0,0,0.02); transition: 0.3s; }
        .search-bar:focus-within { border-color: var(--brand); transform: translateY(-2px); }
        .search-bar input { flex: 1; border: none; background: transparent; color: var(--text); font-size: 1rem; }

        .container { padding: 0 6% 40px 6%; max-width: 800px; margin: 0 auto; }
        .view { display: none; animation: fadeIn 0.4s ease forwards; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* 卡片网格 */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 25px; }
        .card { background: var(--card); padding: 25px; border-radius: var(--radius); text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.03); cursor: pointer; transition: 0.3s; border: 1px solid rgba(0,0,0,0.03); }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.08); border-color: var(--brand); }
        .card i { font-size: 2.2rem; color: var(--brand); margin-bottom: 10px; display: block; }
        .card-brand { background: var(--brand); color: #fff; grid-column: span 2; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .card-brand i, .card-brand b { color: #fff; margin: 0; }
        
        /* 列表项 */
        .post-item { background: var(--card); padding: 22px; border-radius: 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.02); cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .post-item:hover { transform: scale(1.01); border-color: var(--brand); }

        /* 详情页组件 */
        .media-box { width: 100%; border-radius: 15px; margin: 15px 0; overflow: hidden; background: #000; }
        .article-img { width: 100%; border-radius: 15px; margin: 15px 0; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .stat-bar { display: flex; gap: 20px; padding: 20px 0; border-top: 1px solid rgba(0,0,0,0.1); color: var(--sub); }
        
        /* 设置项 */
        .settings-section { margin-top: 25px; background: var(--card); padding: 10px; border-radius: 24px; box-shadow: var(--shadow); }
        .settings-item { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid rgba(0,0,0,0.05); cursor: pointer; transition: 0.2s; }
        .settings-item:last-child { border-bottom: none; }
        .settings-item:hover { background: rgba(0,0,0,0.02); }
        .settings-item i { color: var(--sub); font-size: 1.2rem; }

        /* 输入框 */
        .field { width: 100%; padding: 16px; margin-bottom: 15px; border-radius: 15px; border: 2px solid rgba(0,0,0,0.05); background: #f1f5f9; color: var(--text); font-size: 1rem; transition: 0.3s; }
        .field:focus { border-color: var(--brand); background: var(--card); }
    </style>
</head>
<body>

    <!-- 1. 认证引导层 -->
    <div id="auth-layer">
        <div class="auth-card">
            <div style="width:70px; height:70px; background:var(--brand); border-radius:20px; margin:0 auto 20px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:2rem;"><i class="ri-shield-user-fill"></i></div>
            <h2 style="margin:0 0 10px 0;">SCN Horizon</h2>
            <p style="color:var(--sub); margin-bottom:10px; font-size: 0.95rem;">接入松鹤网络统一身份认证</p>
            <p style="font-size:0.8rem; color:var(--sub); opacity:0.7;">同步昵称、头像与权限</p>
            
            <button class="btn-action" onclick="handleLoginJump()">前往松鹤账号中心登录</button>
            <button class="btn-ghost" onclick="guestLogin()">我是访客，仅浏览</button>
        </div>
    </div>

    <!-- 2. 主应用界面 -->
    <div id="app-layer">
        <nav class="navbar">
            <div class="logo">SCN<span> Odyssey</span></div>
            <div id="nav-user-area" style="display:flex; align-items:center; gap:10px;">
                <span id="nav-name" style="font-size:0.9rem; font-weight:bold;"></span>
                <div id="nav-avatar" class="avatar-sm" onclick="showView('settings')"></div>
            </div>
        </nav>

        <div class="search-container" id="global-search-area">
            <div class="search-bar">
                <i class="ri-search-2-line" style="color:var(--sub)"></i>
                <input type="text" id="search-input" placeholder="搜索文章标题..." oninput="handleSearch()">
            </div>
        </div>

        <div class="container">
            <!-- 首页 -->
            <div id="view-home" class="view active">
                <div style="margin:20px 0;">
                    <h1 style="margin:0; font-size: 2rem;">松鹤新闻</h1>
                    <p style="color:var(--sub); margin-top:5px;">你好，<span id="welcome-name">同学</span>。</p>
                </div>
                
                <div class="grid">
                    <div class="card" onclick="loadNews('news_')"><i class="ri-fire-line"></i><b>校园快讯</b></div>
                    <div class="card" onclick="loadNews('week_')"><i class="ri-article-line"></i><b>深度周刊</b></div>
                    <div class="card" onclick="loadNews('poem_')"><i class="ri-quill-pen-line"></i><b>文学诗词</b></div>
                    <div class="card" onclick="loadNews('all')"><i class="ri-layout-grid-line"></i><b>全部内容</b></div>
                    
                    <div class="card card-brand" id="btn-pub-home" onclick="showView('editor')">
                        <i class="ri-add-circle-fill"></i><b>发布我的新闻</b>
                    </div>
                    
                    <div class="card" style="background:transparent; border:2px dashed #cbd5e1;" onclick="showView('settings')">
                        <i class="ri-settings-4-line" style="color:var(--sub)"></i><b style="color:var(--sub)">设置中心</b>
                    </div>
                </div>
            </div>

            <!-- 列表 -->
            <div id="view-list" class="view">
                <div style="cursor:pointer; color:var(--brand); margin-bottom:20px; display:flex; align-items:center; font-weight:bold;" onclick="showView('home')">
                    <i class="ri-arrow-left-s-line"></i> 返回首页
                </div>
                <h2 id="list-title" style="margin-bottom:20px;">加载中...</h2>
                <div id="list-container"></div>
            </div>

            <!-- 详情 -->
            <div id="view-detail" class="view">
                <div style="cursor:pointer; color:var(--brand); margin-bottom:20px; display:flex; align-items:center; font-weight:bold;" onclick="showView('list')">
                    <i class="ri-arrow-left-s-line"></i> 返回列表
                </div>
                <div id="detail-card" style="background:var(--card); padding:30px; border-radius:25px; box-shadow:0 10px 30px rgba(0,0,0,0.05);"></div>
                
                <div class="stat-bar" id="stat-bar">
                    <div style="display:flex; align-items:center; gap:5px;"><i class="ri-eye-line"></i> <span id="v-count">0</span></div>
                    <div id="like-btn" style="display:flex; align-items:center; gap:5px; cursor:pointer;" onclick="handleLike()">
                        <i class="ri-heart-line"></i> <span id="l-count">0</span>
                    </div>
                </div>
            </div>

            <!-- 编辑器 -->
            <div id="view-editor" class="view">
                <div style="cursor:pointer; color:var(--brand); margin-bottom:20px; display:flex; align-items:center; font-weight:bold;" onclick="showView('home')">
                    <i class="ri-arrow-left-s-line"></i> 放弃创作
                </div>
                <div class="auth-card" style="text-align:left; max-width:none;">
                    <h2 style="margin-top:0;">创作中心</h2>
                    <input type="text" id="p-title" class="field" placeholder="请输入新闻标题">
                    <select id="p-cat" class="field">
                        <option value="news_">校园快讯</option>
                        <option value="week_">深度周刊</option>
                        <option value="poem_">文学诗词</option>
                    </select>
                    <textarea id="p-body" class="field" rows="10" placeholder="正文内容...&#10;支持 [v]URL[/v] 视频和 [a]URL[/a] 音频"></textarea>
                    <button class="btn-action" id="pub-submit-btn" onclick="handleFinalPublish()">立即同步到云端</button>
                </div>
            </div>

            <!-- 设置 -->
            <div id="view-settings" class="view">
                <div style="cursor:pointer; color:var(--brand); margin-bottom:20px; display:flex; align-items:center; font-weight:bold;" onclick="showView('home')">
                    <i class="ri-arrow-left-s-line"></i> 返回
                </div>
                
                <div class="settings-section">
                    <div style="display:flex; align-items:center; gap:15px; padding:10px;">
                        <div id="set-avatar" class="avatar-sm" style="width:60px; height:60px; font-size:1.5rem; box-shadow:0 10px 20px rgba(0,0,0,0.1);"></div>
                        <div>
                            <div id="set-name" style="font-weight:900; font-size:1.2rem;"></div>
                            <div id="set-uid" style="font-size:0.85rem; color:var(--sub); margin-top:2px;"></div>
                        </div>
                    </div>
                </div>

                <div class="settings-section">
                    <div class="settings-item" onclick="handleLoginJump()">
                        <div>
                            <div style="font-weight:600;">松鹤账号管理</div>
                            <div style="font-size:0.75rem; color:var(--sub);">修改昵称、配色与密码</div>
                        </div>
                        <i class="ri-user-settings-line"></i>
                    </div>
                    
                    <div class="settings-item" onclick="checkUpdates()">
                        <div>
                            <div style="font-weight:600;">检查更新</div>
                            <div style="font-size:0.75rem; color:var(--sub);">当前版本: v5.1.0</div>
                        </div>
                        <i class="ri-refresh-line"></i>
                    </div>
                    
                    <div class="settings-item" onclick="downloadApk()">
                        <div>
                            <div style="font-weight:600;">下载 Android 应用</div>
                            <div style="font-size:0.75rem; color:var(--sub);">获取原生体验 (APK)</div>
                        </div>
                        <i class="ri-download-cloud-2-line"></i>
                    </div>
                    
                    <div class="settings-item" onclick="logout()">
                        <div style="font-weight:600; color:#ef4444;">退出登录</div>
                        <i class="ri-logout-box-r-line" style="color:#ef4444;"></i>
                    </div>
                </div>
                
                <div id="admin-entrance" style="margin-top:40px; text-align:center; color:rgba(0,0,0,0.1); font-size:0.7rem; cursor:pointer;" onclick="adminClick()">
                    SCN v5.1.0 Horizon | Powered by Songhe Network
                </div>
            </div>

            <!-- 管理员视图 (隐藏) -->
            <div id="view-admin" class="view">
                <div style="cursor:pointer; color:#facc15; margin-bottom:20px; display:flex; align-items:center;" onclick="showView('home')">
                    <i class="ri-arrow-left-s-line"></i> 退出管理
                </div>
                <div class="auth-card" style="background:#1e293b; color:#fff; text-align:left; max-width:none;">
                    <h2 style="color:#facc15"><i class="ri-shield-user-line"></i> 权限管理中心</h2>
                    <div id="admin-content"></div>
                </div>
            </div>
        </div>
    </div>

<script>
    // --- 核心配置 ---
    const part1 = "ghp_6pSfHi";
    const part2 = "gw0Rrjt5KlrXwvt29Nk2Wi4J2soacY";
    const G_T = part1 + part2;

    const GITHUB = { user: 'Xiejee', repo: 'SCN-News', path: 'news', token: G_T };
    // 此处请替换为你部署的账号中心地址
    const PASSPORT_URL = "https://xiejee.github.io/Songhe-account/"; 
    
    let user = null;
    let newsList = [];
    let currentDocId = "";
    let adminTaps = 0;

    window.onload = () => {
        checkSSO(); // 检查是否有 SSO 令牌传入
        const local = localStorage.getItem('scn_v5_user');
        if(local) {
            user = JSON.parse(local);
            startApp();
        }
        preloadAllNews();
    };

    // --- SSO 逻辑 ---
    function checkSSO() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('songhe_token');
        if (token) {
            try {
                const data = JSON.parse(decodeURIComponent(atob(token)));
                // 更新用户并刷新页面以清除 URL
                user = {
                    uid: data.uid,
                    name: data.name,
                    color: data.color,
                    // 简单的权限判断：你是管理员学号吗？
                    role: (data.uid === '1420240102' || data.uid === '1420240201') ? 'admin' : 'student'
                };
                localStorage.setItem('scn_v5_user', JSON.stringify(user));
                window.history.replaceState({}, document.title, window.location.pathname);
            } catch (e) { console.error("令牌解析失败"); }
        }
    }

    function handleLoginJump() {
        // 携带当前 URL 作为 redirect 参数，前往账号中心
        const currentUrl = window.location.href;
        window.location.href = `${PASSPORT_URL}?redirect=${encodeURIComponent(currentUrl)}`;
    }

    function guestLogin() {
        user = { uid: 'guest', name: '访客', color: '#64748b', role: 'guest' };
        startApp();
    }

    function startApp() {
        document.getElementById('auth-layer').style.opacity = '0';
        setTimeout(() => document.getElementById('auth-layer').style.display = 'none', 500);
        document.getElementById('app-layer').style.display = 'block';
        setTimeout(() => document.getElementById('app-layer').style.opacity = '1', 50);
        
        applyUserTheme();
    }

    function applyUserTheme() {
        if(!user) return;
        
        // 设置全局品牌色
        document.documentElement.style.setProperty('--brand', user.color);
        
        document.getElementById('nav-name').innerText = user.name;
        document.getElementById('welcome-name').innerText = user.name;
        document.getElementById('nav-avatar').innerText = user.name[0];
        document.getElementById('nav-avatar').style.background = user.color;
        
        document.getElementById('set-name').innerText = user.name;
        document.getElementById('set-uid').innerText = user.uid;
        document.getElementById('set-avatar').innerText = user.name[0];
        document.getElementById('set-avatar').style.background = user.color;
        
        if(user.role === 'guest') document.getElementById('btn-pub-home').style.display = 'none';
    }

    // --- 业务逻辑 (同 v5.0) ---
    function showView(vid) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + vid).classList.add('active');
        const searchArea = document.getElementById('global-search-area');
        searchArea.style.display = (vid === 'home' || vid === 'list') ? 'block' : 'none';
        window.scrollTo(0,0);
    }

    async function preloadAllNews() {
        try {
            const res = await fetch(`https://api.github.com/repos/${GITHUB.user}/${GITHUB.repo}/contents/${GITHUB.path}`);
            const data = await res.json();
            const files = data.filter(f => f.name.endsWith('.txt'));
            const detailPromises = files.map(async f => {
                const r = await fetch(f.download_url);
                const txt = await r.text();
                return {
                    id: f.name,
                    title: (txt.match(/TITLE:\s*(.*)/) || [])[1] || f.name,
                    date: (txt.match(/DATE:\s*(.*)/) || [])[1] || "",
                    body: txt.split('---')[1] || ""
                };
            });
            newsList = (await Promise.all(detailPromises)).sort((a,b) => new Date(b.date) - new Date(a.date));
        } catch (e) {}
    }

    async function loadNews(prefix) {
        showView('list');
        document.getElementById('list-container').innerHTML = "<p style='text-align:center;color:var(--sub)'>同步中...</p>";
        document.getElementById('list-title').innerText = "文章目录";
        if(newsList.length === 0) await preloadAllNews();
        const filtered = prefix === 'all' ? newsList : newsList.filter(n => n.id.startsWith(prefix));
        renderList(filtered);
    }

    function renderList(list) {
        document.getElementById('list-container').innerHTML = list.map(n => `
            <div class="post-item" onclick="openDetail('${n.id}')">
                <div>
                    <div style="font-weight:bold; font-size:1.1rem;">${n.title}</div>
                    <div style="font-size:0.8rem; color:var(--sub); margin-top:5px;">${n.date}</div>
                </div>
                <i class="ri-arrow-right-line" style="color:var(--brand)"></i>
            </div>
        `).join('') || "<p style='text-align:center; color:var(--sub); padding:20px;'>空空如也</p>";
    }

    async function openDetail(id) {
        currentDocId = id;
        const item = newsList.find(n => n.id === id);
        if(!item) return;
        let html = item.body.trim();
        html = html.replace(/<file\/picture>(.*?)>/g, (m,p) => `<img src="https://raw.githubusercontent.com/${GITHUB.user}/${GITHUB.repo}/main/pictures/${p.trim()}" class="article-img">`);
        html = html.replace(/\[v\](.*?)\[\/v\]/g, (m,u) => `<div class="media-box"><video controls style="width:100%"><source src="${u.trim()}"></video></div>`);
        html = html.replace(/\[a\](.*?)\[\/a\]/g, (m,u) => `<div class="media-box" style="background:#f1f5f9; padding:15px; display:flex; align-items:center;"><i class="ri-music-fill" style="margin-right:10px; color:var(--brand);"></i><audio controls style="width:100%"><source src="${u.trim()}"></audio></div>`);

        document.getElementById('detail-card').innerHTML = `
            <h1 style="margin-top:0; color:var(--brand); line-height:1.3;">${item.title}</h1>
            <div style="font-size:0.9rem; color:var(--sub); margin-bottom:20px;">发布于 ${item.date}</div>
            <div style="line-height:1.8; white-space:pre-wrap;">${html}</div>
        `;
        
        // 本地计数模拟
        const vKey = `view_${id}`;
        let views = parseInt(localStorage.getItem(vKey) || "0") + 1;
        localStorage.setItem(vKey, views);
        document.getElementById('v-count').innerText = views;
        document.getElementById('l-count').innerText = localStorage.getItem(`like_${id}`) || "0";
        showView('detail');
    }

    function handleLike() {
        if(user.role === 'guest') return alert("访客无法点赞");
        const key = `user_liked_${currentDocId}`;
        if(localStorage.getItem(key)) return alert("已赞过");
        let likes = parseInt(localStorage.getItem(`like_${currentDocId}`) || "0") + 1;
        localStorage.setItem(`like_${currentDocId}`, likes);
        localStorage.setItem(key, 'true');
        document.getElementById('l-count').innerText = likes;
        confetti({ particleCount: 100, colors: [user.color] });
    }

    // --- 发布逻辑 ---
    async function handleFinalPublish() {
        const t = document.getElementById('p-title').value;
        const c = document.getElementById('p-cat').value;
        const b = document.getElementById('p-body').value;
        if(!t || !b) return alert("内容不全");
        const btn = document.getElementById('pub-submit-btn');
        btn.disabled = true; btn.innerText = "上传中...";
        const raw = `TITLE: ${t}\nDATE: ${new Date().toISOString().split('T')[0]}\n---\n${b}\n\n撰稿：${user.name}`;
        const b64 = btoa(unescape(encodeURIComponent(raw)));
        try {
            await fetch(`https://api.github.com/repos/${GITHUB.user}/${GITHUB.repo}/contents/${GITHUB.path}/${c}${Date.now()}.txt`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${GITHUB.token}` },
                body: JSON.stringify({ message: "publish", content: b64 })
            });
            alert("已同步"); preloadAllNews(); showView('home');
        } catch (e) { alert("同步失败: " + e.message); }
        btn.disabled = false; btn.innerText = "立即同步到云端";
    }

    // --- 搜索 ---
    function handleSearch() {
        const q = document.getElementById('search-input').value.toLowerCase();
        if(!q) {
            if(document.getElementById('view-list').classList.contains('active')) renderList(newsList);
            return;
        }
        if(document.getElementById('view-home').classList.contains('active')) {
            showView('list');
            document.getElementById('list-title').innerText = "搜索结果";
        }
        const filtered = newsList.filter(n => n.title.toLowerCase().includes(q));
        renderList(filtered);
    }

    function checkUpdates() { alert("当前版本 v5.1.0 已是最新。"); }
    function downloadApk() {
        const url = `https://github.com/${GITHUB.user}/${GITHUB.repo}/releases/latest`;
        if(confirm("即将前往 GitHub Releases 下载页面。")) window.open(url, '_blank');
    }
    
    function logout() { localStorage.removeItem('scn_v5_user'); location.reload(); }
    
    function adminClick() {
        if(user.role !== 'admin') return;
        if(++adminTaps >= 5) { adminTaps = 0; openAdmin(); }
    }
    
    function openAdmin() {
        showView('admin');
        document.getElementById('admin-content').innerHTML = `<h3>新闻内容管理</h3><div id="admin-news-list"></div>`;
        document.getElementById('admin-news-list').innerHTML = newsList.map(n => `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:12px; border-bottom:1px solid #444;">
                <span>${n.title}</span>
                <button onclick="deleteNews('${n.id}')" style="background:red; color:white; border:none; padding:5px 10px; border-radius:5px;">删除</button>
            </div>
        `).join('') || "暂无内容";
    }

    async function deleteNews(id) {
        if(!confirm("删除？")) return;
        try {
            const res = await fetch(`https://api.github.com/repos/${GITHUB.user}/${GITHUB.repo}/contents/${GITHUB.path}/${id}`);
            const file = await res.json();
            await fetch(`https://api.github.com/repos/${GITHUB.user}/${GITHUB.repo}/contents/${GITHUB.path}/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `token ${GITHUB.token}` },
                body: JSON.stringify({ message: "delete", sha: file.sha })
            });
            alert("已删"); preloadAllNews().then(() => loadNews('all'));
        } catch (e) { alert("失败"); }
    }
</script>
</body>
