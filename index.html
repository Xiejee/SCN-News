<!DOCTYPE html><html lang="zh-CN"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>SCN - Songhe Class News</title>    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.min.css" rel="stylesheet">    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>    <style>        :root {            --scn-blue: #0056b3;            --scn-light-blue: #00a8ff;            --scn-bg: #f4f7f9;            --scn-card: #ffffff;            --scn-text: #2c3e50;            --scn-sub: #7f8c8d;            --ease: cubic-bezier(0.25, 0.8, 0.25, 1);        }        body {            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;            background: var(--scn-bg); margin: 0; color: var(--scn-text);            overflow-x: hidden;        }        /* --- 加载界面 --- */        #loader-screen {            position: fixed; inset: 0; background: #fff;            display: flex; flex-direction: column; align-items: center; justify-content: center;            z-index: 9999; transition: all 0.6s var(--ease);        }        .loader-circle {            width: 50px; height: 50px; border: 4px solid #f0f0f0;            border-top: 4px solid var(--scn-blue); border-radius: 50%;            animation: spin 1s linear infinite; margin-bottom: 20px;        }        @keyframes spin { 100% { transform: rotate(360deg); } }        /* --- 导航栏 --- */        .navbar {            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);            padding: 12px 5%; display: flex; align-items: center; justify-content: space-between;            position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 15px rgba(0,0,0,0.05);        }        .scn-logo { font-size: 1.6rem; font-weight: 900; cursor: pointer; }        .scn-logo .primary { color: var(--scn-blue); }        .scn-logo .accent { color: var(--scn-light-blue); font-weight: 300; font-size: 1.2rem; }        .nav-right { display: flex; align-items: center; gap: 15px; }        .search-box { position: relative; }        .search-box input {            padding: 8px 12px 8px 32px; border-radius: 20px; border: 1px solid #ddd;            background: #f9f9f9; width: 130px; transition: 0.3s; font-size: 0.85rem;        }        .search-box input:focus { width: 180px; border-color: var(--scn-blue); background: #fff; outline: none; }        .search-box i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--scn-sub); }        /* --- 容器 --- */        .container { padding: 20px 5%; max-width: 900px; margin: 0 auto; }        .view { display: none; animation: slideUp 0.4s var(--ease) forwards; }        .view.active { display: block; }        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }        /* --- 统一返回按钮 --- */        .back-nav {            display: inline-flex; align-items: center; gap: 5px;            color: var(--scn-blue); font-weight: bold; cursor: pointer;            margin-bottom: 20px; transition: 0.2s;        }        .back-nav:hover { opacity: 0.7; transform: translateX(-3px); }        /* --- 主页卡片 --- */        .home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; }        .module-card {            background: #fff; padding: 25px 10px; border-radius: 20px; text-align: center;            border: 1px solid #eee; cursor: pointer; transition: 0.3s var(--ease);        }        .module-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); border-color: var(--scn-blue); }        .module-card i { font-size: 2.2rem; color: var(--scn-blue); margin-bottom: 10px; display: block; }        .module-card b { font-size: 1rem; }        /* --- 内容组件 --- */        .post-item {            background: #fff; padding: 18px; border-radius: 15px; margin-bottom: 12px;            display: flex; justify-content: space-between; align-items: center;            cursor: pointer; border: 1px solid #f0f0f0; transition: 0.2s;        }        .post-item:hover { border-color: var(--scn-blue); background: #fcfdfe; }                .article-card { background: #fff; padding: 30px; border-radius: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.03); border: 1px solid #eee; }        .article-img { width: 100%; border-radius: 15px; margin: 15px 0; }        .contributor-footer { margin-top: 30px; padding-top: 15px; border-top: 1px dashed #ddd; text-align: right; color: var(--scn-sub); font-style: italic; }        /* --- 编辑器 --- */        .form-input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 15px; font-family: inherit; box-sizing: border-box; }        .form-input:focus { border-color: var(--scn-blue); outline: none; box-shadow: 0 0 0 3px rgba(0,86,179,0.1); }        .btn-pub { width: 100%; background: var(--scn-blue); color: #fff; padding: 16px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem; }        .btn-pub:hover { background: var(--scn-light-blue); }        /* --- 弹窗 --- */        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 2000; display: none; align-items: center; justify-content: center; }        .modal-content { background: #fff; width: 85%; max-width: 400px; padding: 25px; border-radius: 20px; }    </style></head><body>    <div id="loader-screen">        <div class="loader-circle"></div>        <div style="font-weight:900; color:var(--scn-blue); letter-spacing:2px;">SCN SYSTEM</div>    </div>    <nav class="navbar">        <div class="scn-logo" onclick="showView('home')">            <span class="primary">SCN</span><span class="accent">News</span>        </div>        <div class="nav-right">            <div class="search-box">                <i class="ri-search-line"></i>                <input type="text" id="globalSearch" placeholder="搜索内容...">            </div>            <i class="ri-settings-4-line" style="font-size:1.4rem; cursor:pointer; color:var(--scn-sub);" onclick="showView('settings')"></i>        </div>    </nav>    <div class="container">                <div id="view-home" class="view active">            <div style="margin: 10px 0 25px 0;">                <h2 style="margin:0; color:var(--scn-blue);">你好，同学 👋</h2>                <p style="color:var(--scn-sub); margin:5px 0;">欢迎来到松鹤班级新闻中心</p>            </div>            <div class="home-grid">                <div class="module-card" onclick="switchCategory('news_')"><i class="ri-newspaper-line"></i><b>常规新闻</b></div>                <div class="module-card" onclick="switchCategory('week_')"><i class="ri-calendar-check-line"></i><b>新闻周刊</b></div>                <div class="module-card" onclick="switchCategory('poem_')"><i class="ri-quill-pen-line"></i><b>诗词鉴赏</b></div>                <div class="module-card" onclick="switchCategory('all')"><i class="ri-apps-2-line"></i><b>全部内容</b></div>                <div class="module-card" onclick="showView('editor')" style="background: #f0f7ff;">                    <i class="ri-edit-box-line"></i><b>创作中心</b>                </div>                <div class="module-card" onclick="showView('settings')">                    <i class="ri-settings-5-line" style="color:#666;"></i><b>系统设置</b>                </div>            </div>        </div>        <div id="view-editor" class="view">            <div class="back-nav" onclick="showView('home')"><i class="ri-arrow-left-line"></i> 返回主页</div>            <div class="article-card">                <h3 style="margin-top:0">撰写新闻 <i class="ri-question-line" style="float:right; cursor:pointer;" onclick="toggleHelp()"></i></h3>                <input type="text" id="eTitle" class="form-input" placeholder="文章标题">                <input type="text" id="eAuthor" class="form-input" placeholder="撰稿人署名">                <select id="eCat" class="form-input">                    <option value="news_">常规新闻 (news_)</option>                    <option value="week_">新闻周刊 (week_)</option>                    <option value="poem_">诗词鉴赏 (poem_)</option>                </select>                <textarea id="eBody" class="form-input" rows="8" placeholder="在此输入正文..."></textarea>                <button class="btn-pub" onclick="publish()">提交至 GitHub</button>            </div>        </div>        <div id="view-settings" class="view">            <div class="back-nav" onclick="showView('home')"><i class="ri-arrow-left-line"></i> 返回主页</div>            <div class="article-card">                <h3 style="margin-top:0">关于 SCN</h3>                <p>当前版本：<b>3.5.0.20260131</b></p>                <p>开发者：JEEX</p>                <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">                <h4>检查更新</h4>                <div id="updateLog">正在获取更新信息...</div>                <br>                <a href="https://github.com/Xiejee/SCN-News/raw/main/SCN%20for%20Android.apk" style="text-decoration:none;" class="btn-pub">下载最新 APK</a>            </div>        </div>        <div id="view-list" class="view">            <div class="back-nav" onclick="showView('home')"><i class="ri-arrow-left-line"></i> 返回主页</div>            <h3 id="listTitle">内容列表</h3>            <div id="listContainer"></div>        </div>        <div id="view-detail" class="view">            <div class="back-nav" onclick="showView('list')"><i class="ri-arrow-left-line"></i> 返回列表</div>            <div id="detailContent" class="article-card"></div>        </div>    </div>    <div id="helpModal" class="modal-overlay" onclick="toggleHelp()">        <div class="modal-content" onclick="event.stopPropagation()">            <h4>操作说明</h4>            <p style="font-size:0.85rem; color:var(--scn-sub); line-height:1.6;">                1. 填写完毕后跳转至 GitHub。<br>                2. 点击 <b>Commit changes</b> 即可发布。<br>                3. 无权限请联系：2428943240@qq.com。<br><br>                <b>插图：</b>正文引用 <code>&lt;file/picture&gt;文件名.jpg&gt;</code>            </p>            <button class="btn-pub" onclick="toggleHelp()">我知道了</button>        </div>    </div><script>    const CONFIG = { u:'Xiejee', r:'SCN-News', p:'news', i:'pictures', v:'3.5.0.20260131' };    let newsDB = [];    function showView(vid) {        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));        document.getElementById('view-' + vid).classList.add('active');        window.scrollTo(0,0);    }    function toggleHelp() {        const m = document.getElementById('helpModal');        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';    }    async function init() {        try {            const res = await fetch(`https://api.github.com/repos/${CONFIG.u}/${CONFIG.r}/contents/${CONFIG.p}`);            const files = await res.json();            const ps = files.filter(f => f.name.endsWith('.txt')).map(async f => {                const tr = await fetch(f.download_url);                const t = await tr.text();                return {                    path: f.path, name: f.name,                    title: (t.match(/TITLE:\s*(.*)/i) || [])[1] || f.name,                    date: (t.match(/DATE:\s*(.*)/i) || [])[1] || "2026-01-01",                    body: t.split('---')[1] || ""                };            });            newsDB = (await Promise.all(ps)).sort((a,b) => new Date(b.date.replace(/-/g,'/')) - new Date(a.date.replace(/-/g,'/')));            checkUpd();            setTimeout(() => {                document.getElementById('loader-screen').style.opacity = '0';                setTimeout(() => document.getElementById('loader-screen').style.display = 'none', 600);            }, 800);        } catch (e) { alert("网络异常"); }    }    function switchCategory(cat) {        const f = (cat === 'all') ? newsDB : newsDB.filter(i => i.name.startsWith(cat));        document.getElementById('listTitle').innerText = (cat === 'all') ? '全部内容' : '分类列表';        document.getElementById('listContainer').innerHTML = f.map(item => `            <div class="post-item" onclick="goDetail('${item.path}')">                <div><b>${item.title}</b><br><small style="color:#999">${item.date}</small></div>                <i class="ri-arrow-right-s-line"></i>            </div>        `).join('') || '<p style="text-align:center;color:#999">暂无内容</p>';        showView('list');    }    function goDetail(path) {        const item = newsDB.find(i => i.path === path);        let b = item.body.trim().replace(/&lt;file\/picture&gt;(.*?)&gt;|<file\/picture>(.*?)>/g, (m, p1, p2) => {            return `<img src="https://raw.githubusercontent.com/${CONFIG.u}/${CONFIG.r}/main/${CONFIG.i}/${(p1||p2).trim()}" class="article-img">`;        });        const hasA = b.includes("撰稿人：");        const main = hasA ? b.split("撰稿人：")[0] : b;        const author = hasA ? `<div class="contributor-footer">撰稿人：${b.split("撰稿人：")[1]}</div>` : "";        document.getElementById('detailContent').innerHTML = `            <h2 style="margin:0">${item.title}</h2>            <p style="color:#999; font-size:0.8rem; margin:10px 0 20px 0;"><i class="ri-time-line"></i> ${item.date}</p>            <div style="white-space:pre-wrap; line-height:1.8;">${main}</div>            ${author}        `;        showView('detail');    }    function publish() {        const t = document.getElementById('eTitle').value, a = document.getElementById('eAuthor').value, c = document.getElementById('eCat').value, b = document.getElementById('eBody').value;        if(!t || !a || !b) return alert("请填写完整");        const n = new Date(), ds = `${n.getFullYear()}-${n.getMonth()+1}-${n.getDate()} ${n.getHours()}:${n.getMinutes()}`;        const content = `TITLE: ${t}\nDATE: ${ds}\n---\n${b}\n\n撰稿人：${a}`;        const url = `https://github.com/${CONFIG.u}/${CONFIG.r}/new/main/${CONFIG.p}?filename=${c}${n.getTime()}.txt&value=${encodeURIComponent(content)}`;        window.open(url, '_blank');    }    async function checkUpd() {        try {            const r = await fetch(`https://raw.githubusercontent.com/${CONFIG.u}/${CONFIG.r}/main/software_information.txt`);            const t = await r.text();            const v = (t.match(/VERSION:\s*(.*)/i) || [])[1];            const d = (t.match(/DESC:\s*(.*)/i) || [])[1] || "常规优化。";            const el = document.getElementById('updateLog');            if(v && v.trim() !== CONFIG.v) {                el.innerHTML = `<div style="background:#fff9db; padding:15px; border-radius:12px; border-left:4px solid #fcc419;"><b>新版本 ${v}</b><p style="font-size:0.8rem;margin:5px 0;">${d}</p></div>`;            } else { el.innerHTML = "<p style='color:green'>已是最新版本</p>"; }        } catch(e) {}    }    init();</script></body></html>
